<svg width="192" height="192" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Source for res/mipmap-*/ic_launcher.png. Render with:
       rsvg-convert -w 192 -h 192 ic_launcher.svg -o src/main/res/mipmap-xxhdpi/ic_launcher.png
       Same dice glyph as the Prime launcher icon (prime/resources/icon.svg)
       on the launch-screen's dark steampunk backdrop. -->
  <defs>
    <radialGradient id="albg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#3b2b1e"/>
      <stop offset="55%" stop-color="#241a12"/>
      <stop offset="100%" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="alTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a06a"/>
      <stop offset="50%" stop-color="#b0623c"/>
      <stop offset="100%" stop-color="#5f3222"/>
    </linearGradient>
    <linearGradient id="alLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d98d58"/>
      <stop offset="100%" stop-color="#7c452c"/>
    </linearGradient>
    <linearGradient id="alB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c684"/>
      <stop offset="100%" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="alB2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d18b"/>
      <stop offset="45%" stop-color="#c8913f"/>
      <stop offset="100%" stop-color="#7a4c20"/>
    </linearGradient>
    <linearGradient id="alB3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a97434"/>
      <stop offset="100%" stop-color="#5e3a18"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#albg)"/>
  <ellipse cx="132" cy="212" rx="92" ry="16" fill="#000000" opacity="0.45"/>

  <!-- copper d6, behind and to the upper left -->
  <g transform="translate(100 110)">
    <polygon points="0,-62 52,-31 0,0 -52,-31" fill="url(#alTop)" stroke="#2c1a0c" stroke-width="4"/>
    <polygon points="-52,-31 0,0 0,62 -52,31" fill="url(#alLeft)" stroke="#2c1a0c" stroke-width="4"/>
    <polygon points="52,-31 0,0 0,62 52,31" fill="#6b3a24" stroke="#2c1a0c" stroke-width="4"/>
  </g>

  <!-- brass d8 in front, lower right -->
  <g transform="translate(162 148)">
    <polygon points="0,-64 -52,7 0,23" fill="url(#alB1)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="0,-64 52,7 0,23" fill="url(#alB2)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="-52,7 0,62 0,23" fill="url(#alB3)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="52,7 0,62 0,23" fill="#6e4419" stroke="#3d2510" stroke-width="4"/>
  </g>
</svg>
