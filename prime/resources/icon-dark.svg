<svg width="110" height="110" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark-theme sibling: the same dice glyph with slightly brighter metal
       tones so it does not sink into the near-black badge plate. No
       background element, same rule as icon.svg. -->
  <defs>
    <linearGradient id="icdTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2b078"/>
      <stop offset="50%" stop-color="#c06f46"/>
      <stop offset="100%" stop-color="#733e2a"/>
    </linearGradient>
    <linearGradient id="icdLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e59a63"/>
      <stop offset="100%" stop-color="#8d5134"/>
    </linearGradient>
    <linearGradient id="icdB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d494"/>
      <stop offset="100%" stop-color="#9a6a35"/>
    </linearGradient>
    <linearGradient id="icdB2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8dc9b"/>
      <stop offset="45%" stop-color="#d5a04c"/>
      <stop offset="100%" stop-color="#8a5c2a"/>
    </linearGradient>
    <linearGradient id="icdB3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b98340"/>
      <stop offset="100%" stop-color="#6e4820"/>
    </linearGradient>
  </defs>

  <!-- copper d6, behind and to the upper left -->
  <g transform="translate(103 112)">
    <polygon points="0,-56 48,-28 0,0 -48,-28" fill="url(#icdTop)" stroke="#2c1a0c" stroke-width="4"/>
    <polygon points="-48,-28 0,0 0,56 -48,28" fill="url(#icdLeft)" stroke="#2c1a0c" stroke-width="4"/>
    <polygon points="48,-28 0,0 0,56 48,28" fill="#7a452c" stroke="#2c1a0c" stroke-width="4"/>
  </g>

  <!-- brass d8 in front, lower right -->
  <g transform="translate(160 146)">
    <polygon points="0,-58 -48,6 0,21" fill="url(#icdB1)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="0,-58 48,6 0,21" fill="url(#icdB2)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="-48,6 0,56 0,21" fill="url(#icdB3)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="48,6 0,56 0,21" fill="#7d4f1f" stroke="#3d2510" stroke-width="4"/>
  </g>
</svg>
