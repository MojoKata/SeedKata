<svg width="110" height="110" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- No background element: the launcher composites its own 144 px badge
       plate (silver ring, copper accent, near-black disc) behind this icon,
       so any full-canvas fill would render as a slab over that plate.
       The glyph is scaled to ~58% of the canvas and centred, per the icon
       rules in the SDK migration guide.

       Glyph: the launch-screen dice — a brass 8-sided die in front of a
       copper 6-sided die, same materials as resources/images/dice-banner.svg. -->
  <defs>
    <linearGradient id="icTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a06a"/>
      <stop offset="50%" stop-color="#b0623c"/>
      <stop offset="100%" stop-color="#5f3222"/>
    </linearGradient>
    <linearGradient id="icLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d98d58"/>
      <stop offset="100%" stop-color="#7c452c"/>
    </linearGradient>
    <linearGradient id="icB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c684"/>
      <stop offset="100%" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="icB2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d18b"/>
      <stop offset="45%" stop-color="#c8913f"/>
      <stop offset="100%" stop-color="#7a4c20"/>
    </linearGradient>
    <linearGradient id="icB3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a97434"/>
      <stop offset="100%" stop-color="#5e3a18"/>
    </linearGradient>
  </defs>

  <!-- copper d6, behind and to the upper left -->
  <g transform="translate(103 112)">
    <polygon points="0,-56 48,-28 0,0 -48,-28" fill="url(#icTop)" stroke="#2c1a0c" stroke-width="4"/>
    <polygon points="-48,-28 0,0 0,56 -48,28" fill="url(#icLeft)" stroke="#2c1a0c" stroke-width="4"/>
    <polygon points="48,-28 0,0 0,56 48,28" fill="#6b3a24" stroke="#2c1a0c" stroke-width="4"/>
  </g>

  <!-- brass d8 in front, lower right -->
  <g transform="translate(160 146)">
    <polygon points="0,-58 -48,6 0,21" fill="url(#icB1)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="0,-58 48,6 0,21" fill="url(#icB2)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="-48,6 0,56 0,21" fill="url(#icB3)" stroke="#3d2510" stroke-width="4"/>
    <polygon points="48,6 0,56 0,21" fill="#6e4419" stroke="#3d2510" stroke-width="4"/>
  </g>
</svg>
