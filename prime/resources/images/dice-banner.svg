<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 190">
  <defs>
    <radialGradient id="bg" cx="55%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#3b2b1e"/>
      <stop offset="55%" stop-color="#241a12"/>
      <stop offset="100%" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="brassA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d18b"/>
      <stop offset="45%" stop-color="#c8913f"/>
      <stop offset="100%" stop-color="#7a4c20"/>
    </linearGradient>
    <linearGradient id="brassB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c684"/>
      <stop offset="100%" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="brassC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a97434"/>
      <stop offset="100%" stop-color="#5e3a18"/>
    </linearGradient>
    <linearGradient id="copperA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a06a"/>
      <stop offset="50%" stop-color="#b0623c"/>
      <stop offset="100%" stop-color="#5f3222"/>
    </linearGradient>
    <linearGradient id="copperB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d98d58"/>
      <stop offset="100%" stop-color="#7c452c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f8a80"/>
      <stop offset="100%" stop-color="#4a453d"/>
    </linearGradient>

    <!-- Octahedron (d8), front-vertex view: four visible facets -->
    <g id="d8">
      <polygon points="0,-72 -62,8 0,26" fill="url(#brassB)" stroke="#3d2510" stroke-width="2"/>
      <polygon points="0,-72 62,8 0,26" fill="url(#brassA)" stroke="#3d2510" stroke-width="2"/>
      <polygon points="-62,8 0,72 0,26" fill="url(#brassC)" stroke="#3d2510" stroke-width="2"/>
      <polygon points="62,8 0,72 0,26" fill="#6e4419" stroke="#3d2510" stroke-width="2"/>
    </g>

    <!-- Isometric cube (d6) with copper pips -->
    <g id="d6">
      <polygon points="0,-58 50,-29 0,0 -50,-29" fill="url(#copperA)" stroke="#2c1a0c" stroke-width="2"/>
      <polygon points="-50,-29 0,0 0,58 -50,29" fill="url(#copperB)" stroke="#2c1a0c" stroke-width="2"/>
      <polygon points="50,-29 0,0 0,58 50,29" fill="#6b3a24" stroke="#2c1a0c" stroke-width="2"/>
    </g>

    <!-- Simple steampunk gear -->
    <g id="gear">
      <g fill="url(#steel)">
        <rect x="-5" y="-46" width="10" height="14" rx="2"/>
        <rect x="-5" y="32" width="10" height="14" rx="2"/>
        <rect x="-46" y="-5" width="14" height="10" rx="2"/>
        <rect x="32" y="-5" width="14" height="10" rx="2"/>
        <rect x="-5" y="-46" width="10" height="14" rx="2" transform="rotate(45)"/>
        <rect x="-5" y="32" width="10" height="14" rx="2" transform="rotate(45)"/>
        <rect x="-46" y="-5" width="14" height="10" rx="2" transform="rotate(45)"/>
        <rect x="32" y="-5" width="14" height="10" rx="2" transform="rotate(45)"/>
      </g>
      <circle r="36" fill="url(#steel)" stroke="#2a2622" stroke-width="2"/>
      <circle r="22" fill="#1d1712"/>
      <circle r="9" fill="url(#brassC)" stroke="#2a2622" stroke-width="2"/>
    </g>
  </defs>

  <rect width="480" height="190" fill="url(#bg)"/>

  <!-- background gears -->
  <use xlink:href="#gear" transform="translate(38,168) scale(1.15)" opacity="0.5"/>
  <use xlink:href="#gear" transform="translate(452,20) scale(0.9) rotate(22)" opacity="0.45"/>
  <use xlink:href="#gear" transform="translate(205,-12) scale(0.7) rotate(10)" opacity="0.35"/>

  <!-- speed lines: dice rushing toward the viewer -->
  <g stroke="#e8c684" stroke-width="2" opacity="0.35">
    <line x1="252" y1="92" x2="70" y2="30"/>
    <line x1="250" y1="100" x2="40" y2="102"/>
    <line x1="252" y1="108" x2="80" y2="168"/>
    <line x1="330" y1="60" x2="290" y2="8"/>
    <line x1="370" y1="70" x2="420" y2="18"/>
    <line x1="360" y1="150" x2="420" y2="180"/>
  </g>

  <!-- far d8, tumbling in the distance -->
  <use xlink:href="#d8" transform="translate(66,74) scale(0.42) rotate(-24)" opacity="0.8"/>

  <!-- mid-ground d6 pair -->
  <use xlink:href="#d6" transform="translate(242,64) scale(0.52) rotate(16)" opacity="0.9"/>
  <use xlink:href="#d6" transform="translate(152,112) scale(0.78) rotate(-10)"/>

  <!-- nearest die: the big d8, growing ghosts trailing behind it -->
  <use xlink:href="#d8" transform="translate(295,92) scale(0.62) rotate(11)" opacity="0.16"/>
  <use xlink:href="#d8" transform="translate(312,98) scale(0.78) rotate(7)" opacity="0.3"/>
  <use xlink:href="#d8" transform="translate(338,104) scale(1.02) rotate(3)"/>

  <!-- vignette floor shadow -->
  <ellipse cx="240" cy="188" rx="260" ry="26" fill="#000000" opacity="0.4"/>
</svg>
