<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 190 300">
  <defs>
    <radialGradient id="bgr6" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#3b2b1e"/>
      <stop offset="55%" stop-color="#241a12"/>
      <stop offset="100%" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="cr6top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a06a"/>
      <stop offset="50%" stop-color="#b0623c"/>
      <stop offset="100%" stop-color="#5f3222"/>
    </linearGradient>
    <linearGradient id="cr6left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d98d58"/>
      <stop offset="100%" stop-color="#7c452c"/>
    </linearGradient>
    <linearGradient id="steelr6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f8a80"/>
      <stop offset="100%" stop-color="#4a453d"/>
    </linearGradient>
    <linearGradient id="brassr6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a97434"/>
      <stop offset="100%" stop-color="#5e3a18"/>
    </linearGradient>
    <g id="gearr6">
      <g fill="url(#steelr6)">
        <rect x="-5" y="-46" width="10" height="14" rx="2"/>
        <rect x="-5" y="32" width="10" height="14" rx="2"/>
        <rect x="-46" y="-5" width="14" height="10" rx="2"/>
        <rect x="32" y="-5" width="14" height="10" rx="2"/>
        <rect x="-5" y="-46" width="10" height="14" rx="2" transform="rotate(45)"/>
        <rect x="-5" y="32" width="10" height="14" rx="2" transform="rotate(45)"/>
        <rect x="-46" y="-5" width="14" height="10" rx="2" transform="rotate(45)"/>
        <rect x="32" y="-5" width="14" height="10" rx="2" transform="rotate(45)"/>
      </g>
      <circle r="36" fill="url(#steelr6)" stroke="#2a2622" stroke-width="2"/>
      <circle r="22" fill="#1d1712"/>
      <circle r="9" fill="url(#brassr6)" stroke="#2a2622" stroke-width="2"/>
