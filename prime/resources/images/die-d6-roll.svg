  <rect width="190" height="300" fill="url(#bgr6)"/>

  <!-- steampunk gears tucked into the spare background -->
  <use xlink:href="#gearr6" transform="translate(16,32) scale(0.65) rotate(18)" opacity="0.5"/>
  <use xlink:href="#gearr6" transform="translate(176,268) scale(0.8) rotate(-10)" opacity="0.45"/>

  <ellipse cx="95" cy="262" rx="74" ry="14" fill="#000000" opacity="0.45"/>

  <g transform="translate(95,152)">
    <polygon points="0,-90 78,-45 0,0 -78,-45" fill="url(#cr6top)" stroke="#2c1a0c" stroke-width="3"/>
    <polygon points="-78,-45 0,0 0,90 -78,45" fill="url(#cr6left)" stroke="#2c1a0c" stroke-width="3"/>
    <polygon points="78,-45 0,0 0,90 78,45" fill="#6b3a24" stroke="#2c1a0c" stroke-width="3"/>
  </g>
</svg>
